name: Update daily prices

# Refreshes data/trades.json with the latest daily closes and pushes the result.
# Netlify watches this repo and deploys on push, so no deploy step is needed here.

on:
  schedule:
    # 22:30 UTC, Monday-Friday.
    #
    # The US equity close (16:00 ET) is 20:00 UTC under EDT and 21:00 UTC under
    # EST, and GitHub cron does not observe DST - so a fixed UTC time drifts by
    # an hour across the year. 22:30 UTC leaves a 2h30m buffer in summer and
    # 1h30m in winter for Alpha Vantage to publish the close, and still lands
    # inside the same UTC calendar day, which keeps the commit date and the
    # script's --today default aligned with the trading day just closed.
    #
    # Weekday-only in UTC also means weekday-only in ET at this hour. Market
    # holidays are not excluded - on those days there is no new close, the
    # rebuild is a no-op, and the job exits without committing.
    - cron: '30 22 * * 1-5'

  # Lets you run it on demand from the Actions tab (testing, or a manual refresh).
  workflow_dispatch:

permissions:
  contents: write        # required to push the regenerated trades.json

concurrency:
  group: update-prices   # never let two runs race on the same file
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a full fetch is ~2-3 min at the free tier's request spacing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install step: both scripts use only the Python standard library
      # (json, csv, urllib, argparse, pathlib, datetime, time). Nothing to add.

      - name: Fetch daily closes from Alpha Vantage
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Rebuild checkpoints
        run: python scripts/rebuild_checkpoints.py --write

      - name: Validate JSON before publishing
        run: |
          python -c "import json,sys; d=json.load(open('data/trades.json',encoding='utf-8')); print(f'trades.json valid: {len(d)} trades, {sum(len(t[\"checkpoints\"]) for t in d)} checkpoints')"

      - name: Commit and push if trades.json changed
        run: |
          if git diff --quiet -- data/trades.json; then
            echo "No change to data/trades.json - nothing to commit."
            exit 0
          fi

          echo "Change detected:"
          git diff --stat -- data/trades.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trades.json
          git commit -m "Automated daily price update — $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main
